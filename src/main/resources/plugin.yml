name: WarzPlugin
version: 1.0.0
main: net.minenite.warzplugin.WarzPlugin
api-version: '1.21'
author: icedmoca
description: Warz-only features - fly speed, spawns, and loot chest restock.
softdepend: [ServerPlugin, WorldEdit]

commands:
  speed:
    description: Set your fly speed from 1 to 10. SMOD and above, while flying.
    usage: /speed <1-10>
  setspawn:
    description: Set the first-join spawn, or a numbered death spawn.
    usage: /setspawn [number]
  delspawn:
    description: Remove a numbered death spawn.
    usage: /delspawn <number>
  warz:
    description: Warz loot admin - createchest, createzone, delchest, loot, listchests.
    usage: /warz <createchest|createzone|delchest|loot|listchests|reloot>
    aliases: [wz]
  reloot:
    description: Restock all loot chests and reset the 600s XP-bar timer. DEV and above.
    usage: /reloot
