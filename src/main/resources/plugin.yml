name: WarzPlugin
version: 1.0.0
main: net.minenite.warzplugin.WarzPlugin
api-version: '1.21'
author: icedmoca
description: Warz-only features - fly speed, spawns, loot restock, clans, and world map.
softdepend: [ServerPlugin, WorldEdit]

commands:
  speed:
    description: Set your fly speed from 1 to 10. SMOD and above, while flying.
    usage: /speed <1-10>
  setspawn:
    description: Set the first-join spawn, or a numbered death spawn.
    usage: /setspawn [number]
  delspawn:
    description: Remove a numbered death spawn.
    usage: /delspawn <number>
  warz:
    description: Warz loot admin - createchest, createzone, delchest, loot, listchests.
    usage: /warz <createchest|createzone|delchest|loot|listchests|reloot>
    aliases: [wz]
  reloot:
    description: Restock all loot chests and reset the 600s XP-bar timer. DEV and above.
    usage: /reloot
  clan:
    description: Create, join, leave, invite, and manage clans.
    usage: /clan [create|join|leave|invite|promote|demote|decline|help|<name>]
    aliases: [c]
  humanity:
    description: View your (or another's) humanity standing.
    usage: /humanity [player] | /humanity set <player> <amount>
    aliases: [hum]
  map:
    description: Get the full-server Warz overview map.
    usage: /map
    aliases: [warzmap]
